name: parser-compatibility
on:
  pull_request:
  push:
    branches: [stu-dev/parser/direct-ast]
permissions:
  contents: read
jobs:
  execution:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      SKULPT_PARSER_DIR: ${{ github.workspace }}/node_modules/@anvil-works/skulpt-parser/dist-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Compare with the compatibility checkpoint and CPython
        run: |
          git fetch --depth=1 origin aef4de227d5c802d88d25d786d3f2315d924ec5a
          git worktree add --detach "$RUNNER_TEMP/skulpt-compat" aef4de227d5c802d88d25d786d3f2315d924ec5a
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/skulpt-compat/node_modules"
          (cd "$RUNNER_TEMP/skulpt-compat" && npm run build)
          node test/structural_parser.mjs "$SKULPT_PARSER_DIR/index.js" dist/skulpt.min.js "$RUNNER_TEMP/skulpt-compat/dist/skulpt.min.js"
          node test/tokenize_wrapper.mjs
          node test/identifier_compat.mjs "$RUNNER_TEMP/skulpt-compat/dist/skulpt.min.js" dist/skulpt.min.js
